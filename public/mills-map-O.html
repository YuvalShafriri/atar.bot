    var mills = [{"name": "טחנת דוק", "lat": 32.83812493361215, "lon": 35.13113097138821, "has_assessment": true, "summary": "טחנת הקמח הצלבנית דוק בשמורת עין אפק היא מבנה היסטורי בעל ערכים תרבותיים חשובים, המשקפים את מורשת האזור ואת ההיסטוריה העשירה שהתקיימה בו לאורך השנים. מיקומה הסמוך לנחל נעמן נקשר לחשיבותו של האזור כמרכז חקלאי ותעשייתי במשך מאות שנים, ובמידה רבה, הטחנה משמשת כעדות מוחשית לתקופה הצלבנית באזור עמק עכו.\n..."}, {"name": "טחנת טובי (אל-בוטיטיה) M13 נחל עמוד", "lat": 32.9696737529506, "lon": 35.47537842176486, "has_assessment": false, "summary": "לא בוצע"}, {"name": "טחנות נעמן (טחנות גני רידוואן)", "lat": 32.91516477115773, "lon": 35.0906556843263, "has_assessment": true, "summary": "ערכים:\n\n\n\tמצב השתמרות - מכלול טחנות הקמח הינו יחיד במינו בגודלו ובמצב השתמרותו בארץ. 15 זוגות אבני ריחיים ב-5 מבנים אשר פעלו במקביל. שלמותה היחסי של החזית הדרומית באורך מצטבר של למעלה מ-75 מ&#39; נותן ביטוי לגודלו של המכלול ומשמעותו. באתר קיים מגוון של מצבי השתמרות שונים המאפשרים למבקר להשלים בדמיונ..."}, {"name": "הטחנות הגדולות - Grands Moulins de Palestine", "lat": 32.809419200244584, "lon": 35.006160807344585, "has_assessment": true, "summary": "ערכים:\n\nערך היסטורי - הטחנות הגדולות הינן מהטחנות המודרניות הראשונות בישראל. בעת הבנייה הטחנות נחשבו לאחד המבנים הגדולים והגבוהים בארץ. הטחנות מייצגות את ראשית התעשייה היהודית בארץ ישראל ובחיפה וזכו לתמיכה של הברון אדמונד רוטשילד . הטחנות מהוות שילוב ושיתוף פעולה בין שתי דמויות משמעותיות בפעילות הצי..."}, {"name": "טאחונת אזעירי", "lat": 32.73675, "lon": 35.27012, "has_assessment": false, "summary": "לא בוצע"}, {"name": "טאחונת כואניה ", "lat": 32.73673, "lon": 35.26948, "has_assessment": false, "summary": "לא בוצע"}, {"name": "M21 טחנת שרקרק", "lat": 32.95889172103087, "lon": 35.47796619907669, "has_assessment": false, "summary": "לא בוצע"}, {"name": "טחנת אל-מיר", "lat": 32.10619, "lon": 34.93041, "has_assessment": true, "summary": "None"}, {"name": "טאחונת ערבי ", "lat": 32.73643, "lon": 35.26969, "has_assessment": false, "summary": "לא בוצע"}, {"name": "טחנת השקד M5", "lat": 32.97502910318755, "lon": 35.46853950381201, "has_assessment": false, "summary": "לא בוצע"}, {"name": "M12 טחנת שכווי", "lat": 32.97030411002085, "lon": 35.47506574463263, "has_assessment": false, "summary": "לא בוצע"}, {"name": "טחנת אבו רבאח", "lat": 32.12395, "lon": 34.89893, "has_assessment": true, "summary": "None"}, {"name": "טחנת מרפוקה - עליל", "lat": 32.76892, "lon": 35.15033, "has_assessment": false, "summary": "לא בוצע"}, {"name": "טאחונת ע'ראס ", "lat": 32.74439, "lon": 35.25079, "has_assessment": false, "summary": "לא בוצע"}, {"name": "טחנת קנה M6", "lat": 32.97486791542778, "lon": 35.469429737145134, "has_assessment": false, "summary": "לא בוצע"}, {"name": "טחנת תאנה M8", "lat": 32.973885239991546, "lon": 35.4705374036284, "has_assessment": false, "summary": "לא בוצע"}, {"name": "פרוחיה", "lat": 32.12349, "lon": 34.8907, "has_assessment": true, "summary": "None"}, {"name": "טאחונת אום אל קנטיר ", "lat": 32.73641, "lon": 35.27065, "has_assessment": false, "summary": "לא בוצע"}, {"name": "טחנת הקמח הסחנה (גן השלושה)", "lat": 32.50539128755998, "lon": 35.44869903758214, "has_assessment": true, "summary": "ההערכה התרבותית של המקום והטחנה בגן השלושה\n\nההערכה התרבותית של גן השלושה והטחנה ההיסטורית שבו נובעת מהשילוב של חשיבות היסטורית, סמליות לאומית, ויופי טבעי. המקום מייצג כמה רבדים חשובים בתרבות הישראלית והאזורית:\n\n1. מורשת היסטורית ולאומית:&nbsp;\n\nטחנת הקמח בגן השלושה קשורה באופן ישיר להתיישבות הציונית..."}, {"name": "M10 טחנת אלכסנדר (אסכנדריה)", "lat": 32.973406450821386, "lon": 35.471964855078625, "has_assessment": false, "summary": "לא בוצע"}, {"name": "M11 טחנת שמאי (א-סמאווי)", "lat": 32.97095557802341, "lon": 35.47413239797923, "has_assessment": false, "summary": "לא בוצע"}, {"name": "M15 טחנת אגוז (אום-ג'אוזה)", "lat": 32.97102200207269, "lon": 35.47383078498868, "has_assessment": false, "summary": "לא בוצע"}, {"name": "טאוחנת מוחמד מועיד  ", "lat": 32.73671, "lon": 35.26899, "has_assessment": false, "summary": "לא בוצע"}, {"name": "M20 - טחנת צלף", "lat": 32.959507870080344, "lon": 35.477782840575514, "has_assessment": false, "summary": "לא בוצע"}, {"name": "טחנת הנזירים", "lat": 32.76803910818898, "lon": 35.15876971829136, "has_assessment": true, "summary": "טחנת הנזירים בנחל ציפורי, הינה טחנת קמח מסוג טחנת ארובה כפולה שפעלה באמצעות כוח זרם המים. היא אחת מסט הטחנות שנמצאות בתוואי נחל ציפורי כאשר היא מהמפותחות והגדולות מבניהן. הטחנה קיימת יותר מ200 שנה בבעלות המסדר הכרמליטי ומכאן מגיע גם שמה &ndash; טחנת הנזירים ובערבית &quot;אל-ראהב&quot;.&nbsp;\n\nהיום מ..."}, {"name": "טחנת דולב M7", "lat": 32.97467288433328, "lon": 35.47074883942991, "has_assessment": false, "summary": "לא בוצע"}, {"name": "M16 טחנת גבל/אל ג'בליה", "lat": 32.96995684919286, "lon": 35.474809784035514, "has_assessment": false, "summary": "לא בוצע"}, {"name": "טאחנות עת'מני ", "lat": 32.743, "lon": 35.25756, "has_assessment": false, "summary": "לא בוצע"}, {"name": "M9 טחנת ה'בטאן' - המבטשה", "lat": 32.973465184593834, "lon": 35.469862346888654, "has_assessment": true, "summary": "טחנת קמח המבטשה בנחל עמוד ממוקמת בנקודה אסטרטגית בין נחל מירון לנחל עמוד, במורדות הרי הגליל המזרחי. הנחל מקבל את מימיו ממעיינות שונים הנובעים באזור, כולל עין סתר ועין יקים, ומנקז את המורדות הדרומיים של הרי מירון לכיוון הכנרת. הזרימה השנתית של הנחל, שהייתה חיונית לפעילותן של הטחנות לאורך כל השנה, השפ..."}, {"name": "טאחונת מטליך סעיד סולימן ", "lat": 32.7363, "lon": 35.27017, "has_assessment": false, "summary": "לא בוצע"}, {"name": "M18 טחנת תות (אום א-תות)", "lat": 32.961165559763465, "lon": 35.47718920967917, "has_assessment": false, "summary": "לא בוצע"}, {"name": "M17 טחנת חדיד (אום אל חאדיד)", "lat": 32.964637235767086, "lon": 35.47694033200954, "has_assessment": false, "summary": "לא בוצע"}, {"name": "M14 טחנת גנים", "lat": 32.97198572286161, "lon": 35.473341707223476, "has_assessment": false, "summary": "לא בוצע"}, {"name": "טחנות סכר נחל תנינים ", "lat": 32.542768300552915, "lon": 34.942856856726515, "has_assessment": true, "summary": "הערכה תרבותית\n\nמתוך התבוננות באמנת בורה, ומתוך סקירת האתר כמכלול, אנו סבורות כי בפרויקט המגולמים ערכים רבים, בניהם הערך היסטורי שבא לידי ביטוי בעובדה, כי האתר הוא עדות חייה ל 1600 שנים של היסטוריה הידראולית. להן, ערך מדעי ארכיאולוגי - &nbsp;שכן האתר מהווה ממצה ארכיאולוגי ייחודיי לא&quot;י . וכולל ,מ..."}, {"name": "טחנת רכורדנא (טחנה הוספיטלרית)", "lat": 32.84445, "lon": 35.11698, "has_assessment": false, "summary": "לא בוצע"}, {"name": "טחנת הגפן M4", "lat": 32.97532919952283, "lon": 35.467571942340186, "has_assessment": false, "summary": "לא בוצע"}, {"name": "שבע טחנות - ג'רישה", "lat": 32.096310037397664, "lon": 34.80810755154001, "has_assessment": true, "summary": "מתחם שבע טחנות כולל בו סדרה של טחנות המופעלות על מים לטחינת קמח שנבנו בתקופה העות&#39;מאנית וזכו להרחבה במאה ה19, המתחם שוכן בצמוד לנחל הירקון, מה שמספק להן ערך נופי גבוה. מיקומם בסמוך לנהר, בגדות הירקון, יוצר סצנה טבעית ופסטורלית בשילוב השרידים הארכיאולוגים מתקופת הרומאים והעות&#39;מאניים שנבנו בשי..."}, {"name": "עשר טחנות (אל הדאר)", "lat": 32.1057339687641, "lon": 34.82640518015953, "has_assessment": true, "summary": "ערכים-\n1. ערך היסטורי- טחנת הקמח נמצאת בציר היסטורי משמעותי בו אירעו מספר אירועים מכוננים הרלוונטיים לא רק ברמה האזורית, אלא אף ברמה העולמית. האתר משקף את התהליכים ההיסטורים לאורך הירקון, כחלק מהפריחה ההתיישבותית באזור בתקופה העותמאנית (המאה ה-19) הנקשרת גם לריכוז של טחנות גדולות לאורכו. באותה התקופ..."}];

    // שכבת קלאסטר של סמנים
    var markersCluster = L.markerClusterGroup({
      showCoverageOnHover: false,
      spiderfyOnEveryZoom: false,
      disableClusteringAtZoom: 15
    });

    mills.forEach(function(mill) {
      var cls = mill.has_assessment ? 'dot-green' : 'dot-red';
      var icon = L.divIcon({
        html: '<div class="dot-icon '+cls+'"></div>',
        className: '',
        iconSize: [16,16],
        iconAnchor: [8,8],
        popupAnchor: [0,-8]
      });
      var popupHtml = "<b>" + mill.name + "</b><br>" + (mill.has_assessment ? mill.summary : "לא בוצע");
      var marker = L.marker([mill.lat, mill.lon], {icon: icon}).bindPopup(popupHtml);
      markersCluster.addLayer(marker);
    });

    map.addLayer(markersCluster);

    // שכבת חום
    var heatPoints = mills.map(function(m) { return [m.lat, m.lon, 1.0]; });
    var heat = L.heatLayer(heatPoints, {radius: 25, blur: 15, maxZoom: 17});

    // בקר שכבות
    var overlays = {
      "סמנים מקובצים": markersCluster,
      "מפת חום": heat
    };

    L.control.layers(null, overlays, {collapsed: false}).addTo(map);

    // התאמת תצוגה לכל הנקודות
    var bounds = L.latLngBounds(mills.map(function(m) { return [m.lat, m.lon]; }));
    if (bounds.isValid()) {
      map.fitBounds(bounds.pad(0.1));
    }
  </script>
