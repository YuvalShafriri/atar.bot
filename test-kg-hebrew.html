<!DOCTYPE html>
<html lang="he">
<head>
  <meta charset="UTF-8" />
  <title>Knowledge Graph - Test Hebrew</title>

  <!-- CSS חיצוני קבוע -->
  <link rel="stylesheet"
        href="https://alephplace.com/atar.bot/canvas/knowledge-graph.css"
        crossorigin="anonymous" />

  <!-- vis-network CDN -->
  <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
</head>
<body>
  <div id="mynetwork"></div>

  <div id="infowindow">
    <span id="closeinfo">✖</span>
    <h3 id="info_name"></h3>
    <p><strong>סוג:</strong> <span id="info_type"></span></p>
    <p><strong>ערך מורשתי:</strong> <span id="info_heritageValue"></span></p>
    <p><strong>משמעות:</strong> <span id="info_meaning"></span></p>
  </div>

  <!-- ⬇️ נתוני טסט עם תווים מיוחדים ⬇️ -->
  <script>
    const DATA = {
      "nodes": [
        {
          "id": 1,
          "name": "נח\"ל דן",
          "type": "תופעה טבעית",
          "meaning": "נחל המהווה מקור מים חשוב באזור הצפון",
          "heritageValue": "ערך נופי וסביבתי"
        },
        {
          "id": 2,
          "name": "מבנה השומר",
          "type": "מבנה",
          "meaning": "מבנה היסטורי שימש להגנה על המקום",
          "heritageValue": "ערך היסטורי ואדריכלי"
        },
        {
          "id": 3,
          "name": "מסורת החקלאים",
          "type": "מסורת / מנהג",
          "meaning": "מסורת עתיקה של חקלאות המקום",
          "heritageValue": "ערך חברתי ותרבותי"
        }
      ],
      "edges": [
        {
          "from": 1,
          "to": 2,
          "label": "זורם ליד"
        },
        {
          "from": 2,
          "to": 3,
          "label": "מגן על"
        }
      ]
    };
  </script>

  <!-- JS חיצוני קבוע -->
  <script src="https://alephplace.com/atar.bot/canvas/knowledge-graph.js"
          crossorigin="anonymous"></script>
</body>
</html>
